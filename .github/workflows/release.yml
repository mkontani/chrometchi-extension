name: Release Extension

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zip extension
        run: npm run zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*-chrome.zip
